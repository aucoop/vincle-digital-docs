[project]
site_name = "Vincle Digital"
site_url = "https://aucoop.github.io/vincle-digital-docs/"
site_description = "Guia per als participants del Repair Cafè Vincle Digital"
site_author = "aucoop"
copyright = "Vincle Digital · AUCOOP"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/aucoop/vincle-digital-docs"
repo_name = "aucoop/vincle-digital-docs"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Guia per als participants" = "guia.md" },
]

[project.theme]
language = "ca"
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.top",
  "toc.follow",
  "search.suggest",
  "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Canvia a mode fosc"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Canvia a mode clar"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.emoji = {}
pymdownx.tasklist = { custom_checkbox = true }
admonition = {}
footnotes = {}
