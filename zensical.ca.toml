[project]
site_name = "Vincle Digital"
site_url = "https://aucoop.github.io/vincle-digital-docs/ca/"
site_description = "Flux de recondicionament de mòbils Android amb traçabilitat a DeviceHub"
site_author = "aucoop"
copyright = "Documentació de Vincle Digital"
docs_dir = "i18n/ca"
site_dir = "site/ca"
repo_url = "https://github.com/aucoop/vincle-digital-docs"
repo_name = "aucoop/vincle-digital-docs"
edit_uri = "edit/main/i18n/ca/"
extra_css = ["../stylesheets/extra.css"]
extra_javascript = ["../javascripts/acceso-guia.js", "../javascripts/idioma.js"]
# Lloc en català, construït a site/ca després del castellà (que buida site/).
# Les pàgines mantenen els noms de fitxer i els ids de títol en castellà perquè
# el selector d'idioma porti a la mateixa pàgina i secció. El CSS i el JS
# compartits vénen de l'arrel.
extra.alternate = [
  { name = "Español", link = "https://aucoop.github.io/vincle-digital-docs/", lang = "es" },
  { name = "English", link = "https://aucoop.github.io/vincle-digital-docs/en/", lang = "en" },
  { name = "Català", link = "https://aucoop.github.io/vincle-digital-docs/ca/", lang = "ca" },
]
nav = [
  { "Inici" = "index.md" },
  { "Procés" = [
    { "Vista ràpida" = "diagrama-alto-nivel.md" },
    { "Flux detallat" = "diagramas-detallados.md" },
  ] },
  { "Eines" = [
    { "Etiquetes" = "etiquetas.md" },
    { "Guia al mòbil" = "guia-app.md" },
  ] },
]

[project.theme]
language = "ca"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "content.action.edit",
  "content.action.view",
  "search.suggest",
  "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Canviar a mode fosc"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Canviar a mode clar"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.details = {}
pymdownx.emoji = {}
pymdownx.tabbed = { alternate_style = true }
pymdownx.tasklist = { custom_checkbox = true }
admonition = {}
