name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install -r requirements-docs.txt
      - run: python flujo/generar.py --check
      # El castellano primero: su build vacía site/, donde van site/en y site/ca.
      - run: zensical build --clean --strict
      - run: zensical build --strict -f zensical.en.toml
      - run: zensical build --strict -f zensical.ca.toml

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install -r requirements-docs.txt
      - run: python flujo/generar.py --check
      # El castellano primero: su build vacía site/, donde van site/en y site/ca.
      - run: zensical build --clean
      - run: zensical build -f zensical.en.toml
      - run: zensical build -f zensical.ca.toml
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
