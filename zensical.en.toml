[project]
site_name = "Vincle Digital"
site_url = "https://aucoop.github.io/vincle-digital-docs/en/"
site_description = "Android phone refurbishing flow with traceability in DeviceHub"
site_author = "aucoop"
copyright = "Vincle Digital documentation"
docs_dir = "i18n/en"
site_dir = "site/en"
repo_url = "https://github.com/aucoop/vincle-digital-docs"
repo_name = "aucoop/vincle-digital-docs"
edit_uri = "edit/main/i18n/en/"
extra_css = ["../stylesheets/extra.css"]
extra_javascript = ["../javascripts/acceso-guia.js", "../javascripts/idioma.js"]
# English site, built into site/en after the Spanish one (which wipes site/).
# Pages keep the Spanish file names and heading ids so the language selector
# lands on the same page and section. Shared CSS and JS come from the root.
extra.alternate = [
  { name = "Español", link = "https://aucoop.github.io/vincle-digital-docs/", lang = "es" },
  { name = "English", link = "https://aucoop.github.io/vincle-digital-docs/en/", lang = "en" },
  { name = "Català", link = "https://aucoop.github.io/vincle-digital-docs/ca/", lang = "ca" },
]
nav = [
  { "Home" = "index.md" },
  { "Process" = [
    { "Quick view" = "diagrama-alto-nivel.md" },
    { "Detailed flow" = "diagramas-detallados.md" },
  ] },
  { "Tools" = [
    { "Labels" = "etiquetas.md" },
    { "Guide on the phone" = "guia-app.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "content.action.edit",
  "content.action.view",
  "search.suggest",
  "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.details = {}
pymdownx.emoji = {}
pymdownx.tabbed = { alternate_style = true }
pymdownx.tasklist = { custom_checkbox = true }
admonition = {}
